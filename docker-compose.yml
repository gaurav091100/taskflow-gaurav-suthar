services:
  api:
    build: ./mock-api
    ports:
      - "${MOCK_API_PORT:-4000}:4000"
    environment:
      PORT: 4000

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Browser on the host calls the published API port on localhost
        VITE_API_BASE_URL: "http://localhost:${MOCK_API_PORT:-4000}"
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
